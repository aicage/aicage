name: Lint and Test

"on":
  workflow_call: {}

permissions:
  contents: read

jobs:
  ensure-immutable-actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure workflow actions use immutable refs
        uses: joshjohanning/ensure-immutable-actions@aaa3ba61b950ead2be895ea36a561a5eb11dd82b  # v2.7.2
        with:
          exclude-workflows: 'release.yml'
          include-first-party: 'true'
          write-job-summary: 'on-failure-only'

  test:
    name: Lint and Test (${{ matrix.runner }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - runner: windows-latest
            python-version: "3.15"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Syncing metadata and agents with sub-project 'aicage-image'
        shell: bash
        run: |
          scripts/sync-with-aicage-image-projects.sh

      - name: "Test: Lint Dockerfile"
        if: matrix.runner == 'ubuntu-latest'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          config: .github/linters/.hadolint.yaml
          recursive: "true"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install shellcheck and ripgrep (Ubuntu)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep

      - name: Install shellcheck and ripgrep (Windows)
        if: matrix.runner == 'windows-latest'
        shell: powershell
        run: choco install --no-progress --yes shellcheck ripgrep

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Set up Skrog Docker WSL
        if: matrix.runner == 'windows-latest'
        uses: gh-workflow/setup-docker-wsl@696cc245db4387e47132acbe6df1437531e104bc  # v1.0.4
        with:
          verify-docker-in-containers: "true"

      - name: Lint
        shell: bash
        run: |
          ./scripts/lint.sh

      - name: Validating config with schemas
        shell: bash
        run: |
          scripts/validate-config-with-schemas.sh

      - name: Test
        shell: bash
        run: |
          pytest --cov=src --cov-report=term-missing
