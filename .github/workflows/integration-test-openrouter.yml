name: Integration Tests (OpenRouter)

"on":
  workflow_call:
    inputs:
      include_macos:
        description: Include macOS (very long)
        required: false
        default: false
        type: boolean
      include_windows:
        description: Include Windows
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      include_macos:
        description: Include macOS (very long)
        required: false
        default: false
        type: boolean
      include_windows:
        description: Include Windows
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  prepare_matrix:
    name: Select test runners
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.select.outputs.runners }}
    steps:
      - id: select
        env:
          INCLUDE_MACOS: ${{ inputs.include_macos }}
          INCLUDE_WINDOWS: ${{ inputs.include_windows }}
        run: |
          runners=()
          if [[ "$INCLUDE_MACOS" == "true" ]]; then
            runners+=(macos-26-intel)
          fi
          if [[ "$INCLUDE_WINDOWS" == "true" ]]; then
            runners+=(windows-latest)
          fi
          runners+=(ubuntu-latest ubuntu-24.04-arm)
          printf -v runners_json '"%s",' "${runners[@]}"
          echo "runners=[${runners_json%,}]" >> "$GITHUB_OUTPUT"

  build-wheel:
    name: Build aicage wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Syncing metadata and agents with sub-project 'aicage-image'
        run: scripts/sync-with-aicage-image-projects.sh

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel --outdir dist

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: aicage-wheel
          path: dist/*.whl
          if-no-files-found: error

  integration-openrouter:
    name: OpenRouter ACP tests (${{ matrix.runner }})
    needs: [build-wheel, prepare_matrix]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.prepare_matrix.outputs.runners) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: aicage-wheel
          path: dist

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Set up Docker Desktop (macOS)
        if: contains(matrix.runner, 'macos')
        uses: gh-workflow/setup-docker-desktop-macos@275ff92cc293a098478cb1220bd59c0579d7320f  # 0.0.15
        with:
          print_diagnostics: true

      - name: Set up Docker WSL (Windows)
        if: contains(matrix.runner, 'windows')
        uses: gh-workflow/setup-docker-wsl@696cc245db4387e47132acbe6df1437531e104bc  # v1.0.4
        with:
          verify-docker-in-containers: "true"

      - name: Verify Linux Docker engine
        shell: bash
        run: |
          test "$(docker info --format '{{.OSType}}')" = linux

      - name: Run OpenRouter ACP smoke test
        env:
          AICAGE_OPENROUTER_ARTIFACT_DIR: ${{ runner.temp }}/aicage-openrouter-logs
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/test-openrouter-acp.py

      - name: Upload aicage logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: aicage-openrouter-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/aicage-openrouter-logs
          if-no-files-found: ignore
