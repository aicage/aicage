name: Integration Tests

"on":
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integration-discover:
    name: Discover Integration Tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Syncing metadata and agents with sub-project 'aicage-image'
        run: |
          scripts/sync-with-aicage-image-projects.sh

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validating config with schemas
        run: |
          scripts/validate-config-with-schemas.sh

      - id: collect
        name: Collect integration tests
        run: scripts/collect-integration-test-matrix.py

      - name: Print integration matrix
        env:
          MATRIX_JSON: ${{ steps.collect.outputs.matrix }}
        run: |
          printf '%s\n' "$MATRIX_JSON" | python -m json.tool

  integration:
    name: Integration (${{ matrix.test }})
    runs-on: ubuntu-latest
    needs: integration-discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.integration-discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Syncing metadata and agents with sub-project 'aicage-image'
        run: |
          scripts/sync-with-aicage-image-projects.sh

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validating config with schemas
        run: |
          scripts/validate-config-with-schemas.sh

      - name: Run integration test
        env:
          AICAGE_RUN_INTEGRATION: "1"
          TEST_NODE: ${{ matrix.test }}
        run: pytest -m "integration and not proxy_integration" "$TEST_NODE"

      - name: "On failure: Collect aicage logs"
        if: failure()
        env:
          JOB_INDEX: ${{ strategy.job-index }}
        run: |
          artifact_dir="$RUNNER_TEMP/aicage-logs-$JOB_INDEX"
          mkdir -p "$artifact_dir"
          while IFS= read -r path; do
            rel_path="${path#/}"
            target_dir="$artifact_dir/$(dirname "$rel_path")"
            mkdir -p "$target_dir"
            cp -R "$path" "$target_dir/"
          done < <(
            find "${TMPDIR:-/tmp}" \
              \( -type d -path "*/pytest-of-${USER}/*/.aicage" \
              -o -type d -path "*/aicage-test-home-*/.aicage" \) \
              2>/dev/null | sort -u
          )

      - name: "On failure: Upload aicage logs"
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: aicage-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/aicage-logs-${{ strategy.job-index }}
          if-no-files-found: ignore
