name: Integration Tests (macOS Full)

"on":
  workflow_dispatch:
    inputs:
      pytest_filter:
        description: Optional extra pytest arguments, for example a test path or -k expression.
        required: false
        default: ""
        type: string
      upload_logs_on_success:
        description: Upload aicage logs even when the test succeeds.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  integration-discover:
    name: Discover Integration Tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Syncing metadata and agents with sub-project 'aicage-image'
        run: |
          scripts/sync-with-aicage-image-projects.sh

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validating config with schemas
        run: |
          scripts/validate-config-with-schemas.sh

      - id: collect
        name: Collect integration tests
        env:
          PYTEST_FILTER: ${{ inputs.pytest_filter }}
        run: scripts/collect-integration-test-matrix.py

      - name: Print integration matrix
        env:
          MATRIX_JSON: ${{ steps.collect.outputs.matrix }}
        run: |
          printf '%s\n' "$MATRIX_JSON" | python -m json.tool

  integration-macos:
    name: macOS full integration (${{ matrix.test }})
    runs-on: macos-26-intel
    needs: integration-discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.integration-discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Syncing metadata and agents with sub-project 'aicage-image'
        run: |
          scripts/sync-with-aicage-image-projects.sh

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validating config with schemas
        run: |
          scripts/validate-config-with-schemas.sh

      - name: Set up Docker Desktop
        uses: gh-workflow/setup-docker-desktop-macos@275ff92cc293a098478cb1220bd59c0579d7320f  # 0.0.15
        with:
          print_diagnostics: false

      - name: Run macOS full integration test
        env:
          AICAGE_RUN_INTEGRATION: "1"
          TEST_NODE: ${{ matrix.test }}
        run: pytest -m "integration and not proxy_integration" "$TEST_NODE"

      - name: Collect aicage logs
        if: failure() || inputs.upload_logs_on_success
        env:
          JOB_INDEX: ${{ strategy.job-index }}
        run: |
          artifact_dir="$RUNNER_TEMP/aicage-logs-$JOB_INDEX"
          mkdir -p "$artifact_dir"
          if [ -d "$HOME/.aicage" ]; then
            mkdir -p "$artifact_dir/$HOME"
            cp -R "$HOME/.aicage" "$artifact_dir/$HOME/"
            printf 'Collected log directory:\n  %s\n' "$HOME/.aicage"
          else
            echo "Expected macOS integration logs at $HOME/.aicage, but that directory does not exist." >&2
          fi

      - name: Upload aicage logs
        if: failure() || inputs.upload_logs_on_success
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: aicage-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/aicage-logs-${{ strategy.job-index }}
          if-no-files-found: ignore
