name: Integration Tests (Windows)

"on":
  workflow_call:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow_ref }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-discover:
    name: Discover Integration Tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Syncing metadata and agents with sub-project 'aicage-image'
        run: |
          scripts/sync-with-aicage-image-projects.sh

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validating config with schemas
        run: |
          scripts/validate-config-with-schemas.sh

      - id: collect
        name: Collect integration tests
        run: scripts/collect-integration-test-matrix.py

  integration-windows:
    name: Integration (${{ matrix.test }})
    runs-on: windows-latest
    needs: integration-discover
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.integration-discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Syncing metadata and agents with sub-project 'aicage-image'
        shell: bash
        run: |
          scripts/sync-with-aicage-image-projects.sh

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Set up Skrog Docker WSL
        uses: gh-workflow/setup-docker-wsl@696cc245db4387e47132acbe6df1437531e104bc  # v1.0.4
        with:
          verify-docker-in-containers: "true"

      - name: Run Windows Docker integration tests
        shell: bash
        env:
          AICAGE_RUN_INTEGRATION: "1"
          TEST_NODE: ${{ matrix.test }}
        run: |
          pytest -m "integration and not proxy_integration" "$TEST_NODE"

      - name: Collect aicage logs
        if: failure()
        shell: powershell
        env:
          JOB_INDEX: ${{ strategy.job-index }}
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "aicage-logs-$env:JOB_INDEX"
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA "Temp") -Directory -Filter "aicage-test-home-*" |
            ForEach-Object {
              Copy-Item -Recurse -Force $_.FullName $artifactDirectory
            }

      - name: Upload aicage logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: aicage-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/aicage-logs-${{ strategy.job-index }}
          if-no-files-found: ignore
          include-hidden-files: true
