name: Release

"on":
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tagged-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tagged commit is on origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}, but that commit is not on origin/main." >&2
            echo "Push the commit to origin/main before pushing the release tag." >&2
            exit 1
          fi

  change-validation:
    needs: verify-tagged-commit
    uses: ./.github/workflows/change-validation.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write

  integration-test-windows:
    needs: verify-tagged-commit
    uses: ./.github/workflows/integration-test-windows.yml

  integration-test-openrouter:
    needs: verify-tagged-commit
    uses: ./.github/workflows/integration-test-openrouter.yml
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  publish:
    name: Publish to PyPI
    needs:
      - verify-tagged-commit
      - change-validation
      - integration-test-windows
      - integration-test-openrouter
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aicage
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Update cosign digest constant
        run: scripts/update-cosign-image-digest.sh

      - name: Syncing metadata and agents with sub-project 'aicage-image'
        run: |
          scripts/sync-with-aicage-image-projects.sh

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Build package
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.ref_name }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Smoke test built wheel
        run: |
          python -m venv .release-venv
          source .release-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          aicage --version

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Validating config with schemas (again)
        run: |
          scripts/validate-config-with-schemas.sh

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist

      - name: Create SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Keyless sign SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CHANGELOG_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/CHANGELOG.md"
          RELEASE_NOTES="See [CHANGELOG.md](${CHANGELOG_URL}) for release notes."
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --notes "${RELEASE_NOTES}" \
            --generate-notes
